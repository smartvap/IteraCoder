appId: com.iteracoder.agent-hub
productName: 需求拆解Agent
copyright: Copyright © 2024 IteraCoder
directories:
  output: release
  buildResources: public
files:
  - dist/**/*
  - electron/**/*
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-Setup-${version}.${ext}
  icon: public/icon.ico
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: 需求拆解Agent
  deleteAppDataOnUninstall: true
  installerIcon: public/icon.ico
  uninstallerIcon: public/icon.ico
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: public/icon.ico
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: public/icon.png
extraResources:
  - from: server
    to: server
    filter:
      - "**/*"
