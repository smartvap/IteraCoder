server:
  port: 8989
  max-http-request-header-size: 32KB

spring:
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 20MB        # llm-wiki知识库单文件上传上限
      max-request-size: 20MB      # llm-wiki知识库单次请求总上限

agenthub:
  workflow:
    saver-type: mysql  # 工作流状态存储: memory / mysql / redis
    model-roles:                     # 固定角色 → 模型名映射（需与 spring.ai.models 中某个 name 一致）
      decomposition: qwen3:8b-q4_K_M          # 需求拆解
      reasoning-models: qwen3:8b-q4_K_M,qwen3:4b  # 并行推理模型列表（逗号分隔）
      merge-result: qwen3:8b-q4_K_M           # 合并推理结果
      manual-review: qwen3:8b-q4_K_M          # 人工审核摘要生成
      code-generation: qwen3:8b-q4_K_M         # 代码生成
      harness: qwen3:8b-q4_K_M                # 沙箱验证
      repair: qwen3:8b-q4_K_M                 # 代码修复
    max-repair-iterations: 20         # 代码修复循环最大轮次

    # Git 推送配置（enabled=false 时使用本地目录方式）
    code-storage-path: "D:\\agenthub-codegen"  # 本地目录，不配或为空时默认项目根目录/temp
    git:
      enabled: true                          # 是否将项目代码推送到远程 Git 仓库
      remote-url: http://192.168.46.143:3000       # Git 服务地址（Gitea/GitLab）
      api-base-url: http://192.168.46.143:3000/api/v1  # API 地址（Gitea: /api/v1, GitLab: /api/v4）
      token: "${GIT_TOKEN}"                  # API Token（环境变量优先，避免硬编码）
      repo-owner: agent-hub                    # 仓库所属组织/用户
      username: agent                      # 提交者姓名
      email: he14227968@163.com                   # 提交者邮箱
    # DinD 沙箱 Docker 连接（各 profile 覆盖 docker-host）
    sandbox:
      docker-host: "unix:///var/run/docker.sock"
      image-name: "agent-hub/sandbox:latest"
      network-enabled: true                      # 容器是否联网（内网环境需改为 false）
      memory-mb: 512
      cpu-limit: 1.0
      timeout-seconds: 120
      build-response-timeout-seconds: 1800        # Docker 构建 HTTP 响应超时（秒），慢网络需加大
      # Docker-in-Docker：true 时自动拉起 docker:dind 容器，沙箱在内部 Docker 执行
      dind-enabled: true
      dind-image: "agent-hub/dind:28"
      dind-container-name: "agent-hub-dind"
      dind-expose-port: 2376                        # DinD 容器内部 Docker 暴露端口
  jwt:
    admin-secret-key: agent_jwt_secret_key_for_admin_access_256_bits_required
    admin-ttl: 7200000
    admin-token-name: token
    user-secret-key: agent_jwt_secret_key_for_user_access_256_bits_required
    user-ttl: 7200000
    user-token-name: authorization

logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: debug
    com:
      alibaba:
        cloud:
          ai:
            graph:
              agent:
                node:
                  AgentLlmNode: warn
