server:
  port: 8989

spring:
  profiles:
    active: dev

agenthub:
  workflow:
    saver-type: mysql  # 工作流状态存储: memory / mysql / redis
    model-roles:                     # 固定角色 → 模型名映射（需与 spring.ai.models 中某个 name 一致）
      decomposition: glm-5.1          # 需求拆解（需结构化中文输出，小模型不可靠）
      code-generation: deepseek-v4-flash         # 代码生成
      harness: deepseek-v4-flash                 # 沙箱验证
      repair: deepseek-v4-flash                  # 代码修复
    reasoning-models: deepseek-v4-flash,glm-5.1  # 并行推理模型列表（逗号分隔）
  jwt:
    admin-secret-key: agent_jwt_secret_key_for_admin_access_256_bits_required
    admin-ttl: 7200000
    admin-token-name: token
    user-secret-key: agent_jwt_secret_key_for_user_access_256_bits_required
    user-ttl: 7200000
    user-token-name: authorization

logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: debug
