<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能体研发工作流管理控制台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
            background-color: #f5f5f5;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin-bottom: 24px;
        }

        .section {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }

        .section h2 {
            font-size: 16px;
            color: #333;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .section h2 .badge {
            display: inline-block;
            padding: 2px 8px;
            font-size: 11px;
            border-radius: 3px;
            color: #fff;
            margin-right: 6px;
            vertical-align: middle;
        }
        .badge.post { background: #28a745; }
        .badge.get  { background: #007bff; }

        .form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            align-items: center;
        }

        .form-row:last-child {
            margin-bottom: 0;
        }

        label {
            font-size: 14px;
            color: #555;
            white-space: nowrap;
            min-width: 70px;
            text-align: right;
        }

        input, textarea, select {
            flex: 1;
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
            min-height: 70px;
        }

        select {
            cursor: pointer;
        }

        button {
            padding: 10px 24px;
            font-size: 14px;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
            white-space: nowrap;
        }

        button.primary { background-color: #007bff; }
        button.primary:hover { background-color: #0056b3; }
        button.success { background-color: #28a745; }
        button.success:hover { background-color: #1e7e34; }
        button.warning { background-color: #ffc107; color: #333; }
        button.warning:hover { background-color: #e0a800; }
        button.danger  { background-color: #dc3545; }
        button.danger:hover  { background-color: #bd2130; }
        button.info    { background-color: #17a2b8; }
        button.info:hover    { background-color: #117a8b; }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .btn-row {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        /* 审核决策按钮组 */
        .decision-group {
            display: flex;
            gap: 10px;
        }

        #loading {
            display: none;
            margin: 16px auto;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-panel {
            margin-top: 16px;
            padding: 14px;
            border-radius: 6px;
            background: #f8f9fa;
            border: 1px solid #e0e0e0;
            font-size: 13px;
            line-height: 1.7;
            display: none;
            max-height: 500px;
            overflow-y: auto;
        }

        .result-panel.show {
            display: block;
        }

        .result-panel.error {
            background: #fff5f5;
            border-color: #f5c6cb;
        }

        .status-tag {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-RUNNING        { background: #cce5ff; color: #004085; }
        .status-WAITING_REVIEW { background: #fff3cd; color: #856404; }
        .status-COMPLETED      { background: #d4edda; color: #155724; }
        .status-TERMINATED     { background: #f8d7da; color: #721c24; }
        .status-FAILED         { background: #e2e3e5; color: #383d41; }

        .kv-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
        }
        .kv-table th, .kv-table td {
            text-align: left;
            padding: 6px 10px;
            border-bottom: 1px solid #e0e0e0;
            font-size: 13px;
            vertical-align: top;
        }
        .kv-table th {
            width: 180px;
            color: #555;
            font-weight: normal;
        }
        .field-desc {
            display: block;
            font-size: 11px;
            color: #888;
            margin-top: 2px;
            font-weight: normal;
        }
        .kv-table td {
            word-break: break-all;
            color: #333;
        }

        .code-block {
            background: #2d2d2d;
            color: #e0e0e0;
            padding: 12px;
            border-radius: 4px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 240px;
            overflow-y: auto;
        }

        .tip {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }

        /* 进度面板 */
        .progress-panel {
            display: none;
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        .progress-panel.show {
            display: block;
        }
        .progress-step {
            display: flex;
            align-items: center;
            padding: 6px 0;
            font-size: 13px;
            color: #999;
        }
        .progress-step .step-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid #ccc;
            margin-right: 10px;
            flex-shrink: 0;
            text-align: center;
            line-height: 16px;
            font-size: 10px;
        }
        .progress-step.done { color: #28a745; }
        .progress-step.done .step-icon { background: #28a745; border-color: #28a745; color: #fff; }
        .progress-step.active { color: #007bff; font-weight: bold; }
        .progress-step.active .step-icon { border-color: #007bff; animation: pulse 1.5s infinite; }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.4); }
            50%      { box-shadow: 0 0 0 6px rgba(0,123,255,0); }
        }
        @keyframes dotPulse {
            0%, 20%  { opacity: 0.2; }
            50%      { opacity: 1; }
            80%, 100% { opacity: 0.2; }
        }
        .thinking-dot {
            animation: dotPulse 1.2s infinite;
        }
        .thinking-dot:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dot:nth-child(3) { animation-delay: 0.4s; }
        .progress-step .step-time {
            margin-left: auto;
            font-size: 11px;
            color: #aaa;
        }
        .step-body {
            margin-left: 30px;
            margin-top: 4px;
            padding: 6px 10px;
            background: #f8f9fa;
            border-left: 2px solid #e0e0e0;
            font-size: 12px;
            color: #555;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 300px;
            min-height: 40px;
            overflow-y: auto;
            border-radius: 0 4px 4px 0;
        }
    </style>
</head>
<body>
<h1>智能体研发工作流管理控制台</h1>
<p class="subtitle">StateGraph + ReactAgent 智能体工作流：需求拆解 → 并行推理 → 人工审核 → 代码生成</p>

<!-- ==================== 1. 启动工作流 ==================== -->
<div class="section">
    <h2><span class="badge post">POST</span> 启动智能体研发工作流</h2>
    <div class="form-row">
        <label for="requirement">研发需求</label>
        <textarea id="requirement" rows="3" placeholder="请输入原始研发需求，例如：开发一个java项目，实现pdf转word功能"></textarea>
    </div>
    <div class="btn-row">
        <button id="btnStart" class="primary" onclick="startWorkflow()">启动智能体工作流</button>
    </div>
    <div class="tip">提交后将执行需求拆解 → 并行推理，并在人工审核节点自动暂停</div>
</div>

<!-- ==================== 2. 查询/恢复工作流（页面刷新后使用） ==================== -->
<div class="section">
    <h2><span class="badge get">GET</span> 查询智能体工作流状态</h2>
    <div class="form-row">
        <label for="queryThreadId">Thread ID</label>
        <input type="text" id="queryThreadId" placeholder="输入智能体工作流 threadId">
        <button class="info" onclick="queryState()">查询</button>
    </div>
    <input type="hidden" id="resumeThreadId">
    <div class="tip">页面刷新后可通过 Thread ID 查询之前的智能体工作流状态</div>
</div>

<!-- 加载 & 结果 -->
<div id="loading"></div>
<div id="progress" class="progress-panel">
    <h2 style="font-size:16px;color:#333;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #eee;">
        执行进度 <span id="progressThreadId" style="font-size:12px;color:#999;font-weight:normal;"></span>
    </h2>
    <div id="steps"></div>
    <!-- 审核操作区域（固定展示，按钮可用性由 setResumeButtonsEnabled 控制） -->
    <div id="reviewSection" style="display:block;margin-top:16px;padding-top:16px;border-top:2px solid #ffc107;border-radius:4px;">
        <div style="background:#fff3cd;padding:12px;border-radius:6px;margin-bottom:12px;">
            <strong style="color:#856404;">⏸ 等待人工审核</strong>
            <span style="color:#856404;font-size:12px;margin-left:8px;">请审核以上推理结果后选择操作</span>
        </div>
        <div class="form-row">
            <label for="comment">审核备注</label>
            <input type="text" id="comment" placeholder="可选，审核备注说明">
        </div>
        <div class="btn-row decision-group">
            <button id="btnApprove" class="success" onclick="resumeWorkflow('APPROVED')">✓ 通过 (APPROVED)</button>
            <button id="btnSentBack" class="warning" onclick="resumeWorkflow('SENT_BACK')">↩ 驳回 (SENT_BACK)</button>
            <button id="btnTerminate" class="danger"  onclick="resumeWorkflow('TERMINATED')">✗ 拒绝 (TERMINATED)</button>
        </div>
        <div class="tip">通过 → 进入代码生成 | 驳回 → 回到需求拆解 | 拒绝 → 终止流程</div>
    </div>
    <!-- 终态信息区域（COMPLETED / TERMINATED / FAILED 时显示） -->
    <div id="finalStatus" style="display:none;margin-top:16px;padding:12px;border-radius:6px;"></div>
    <!-- 恢复执行区域（RUNNING / FAILED 状态显示） -->
    <div id="recoverSection" style="display:none;margin-top:16px;padding:12px;border-radius:6px;background:#e3f2fd;border:1px solid #90caf9;">
        <strong style="color:#1565c0;" id="recoverTitle">🔁 工作流处于执行中状态</strong>
        <span style="color:#1565c0;font-size:12px;margin-left:8px;">可从 checkpoint 恢复</span>
        <button class="info" onclick="recoverWorkflow()" style="margin-left:16px;">▶ 恢复执行</button>
    </div>
</div>
<div id="result" class="result-panel"></div>

<script>
    const API_BASE = '/api/v1/workflow';
    let es = null; // EventSource
    let pollFallback = null; // SSE 无事件时的后台轮询
    let pollDelayTimer = null; // 轮询延迟启动定时器

    // 工作流步骤定义
    const WORKFLOW_STEPS = [
        { key: 'requirement',               name: '智能体工作流初始化' },
        { key: 'decomposition_result',      name: '需求拆解' },
        { key: '_reasoning',                name: '并行推理' },
        { key: 'parallel_reasoning_result', name: '合并推理结果' },
        { key: '_review',                   name: '等待人工审核' },
        { key: 'generated_code',            name: '代码生成' },
    ];

    function nowStr() {
        const d = new Date();
        return d.getHours().toString().padStart(2,'0') + ':'
             + d.getMinutes().toString().padStart(2,'0') + ':'
             + d.getSeconds().toString().padStart(2,'0');
    }

    // State 字段中文描述映射
    const FIELD_LABELS = {
        'requirement':                          '原始需求',
        'workflow_status':                      '工作流状态',
        'workflow_message':                     '工作流消息',
        'decomposition_result':                 '需求拆解结果',
        'parallel_reasoning_result':            '并行推理合并结果',
        'review_content':                       '审核内容',
        'review_decision':                      '审核决定（APPROVED/驳回）',
        'review_feedback':                      '审核备注/驳回原因',
        'generated_code':                       'AI 生成代码',
        '_graph_execution_id_':                 '工作流实例ID',
    };

    // 动态 key 中文描述（reasoning_*_result）
    function fieldLabel(key) {
        if (FIELD_LABELS[key]) return FIELD_LABELS[key];
        const match = key.match(/^reasoning_(.+?)_result$/);
        if (match) {
            return '推理结果 [' + match[1].replace(/_/g, '-') + ']';
        }
        return '';
    }

    function $(id) { return document.getElementById(id); }

    function showLoading() {
        $('loading').style.display = 'block';
        $('result').classList.remove('show', 'error');
    }

    function hideLoading() {
        $('loading').style.display = 'none';
    }

    function showResult(html, isError) {
        hideLoading();
        const panel = $('result');
        panel.innerHTML = html;
        panel.classList.add('show');
        if (isError) panel.classList.add('error');
        panel.scrollTop = 0;
    }

    function statusTag(status) {
        return `<span class="status-tag status-${status}">${status}</span>`;
    }

    function renderStateTable(state) {
        if (!state || Object.keys(state).length === 0) return '';
        let rows = '';
        for (const [k, v] of Object.entries(state)) {
            let displayVal = (v === null || v === undefined) ? '<em>null</em>' : String(v);
            if (displayVal.length > 300) {
                displayVal = '<div class="code-block">' + escapeHtml(displayVal) + '</div>';
            } else {
                displayVal = escapeHtml(displayVal);
            }
            const desc = fieldLabel(k);
            const descHtml = desc ? '<span class="field-desc">' + desc + '</span>' : '';
            rows += `<tr><th>${escapeHtml(k)}${descHtml}</th><td>${displayVal}</td></tr>`;
        }
        return `<table class="kv-table">${rows}</table>`;
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // ===== 进度面板 =====
    function checkStepDone(state, step) {
        if (step.key === '_review') {
            if (state['workflow_status'] === 'WAITING_REVIEW') return true;
            const d = state['review_decision'];
            return d === 'APPROVED' || d === 'TERMINATED';
        }
        if (step.key === 'requirement') {
            return !!(state['workflow_message'] || state['decomposition_result']);
        }
        if (step.key === 'decomposition_result') {
            // 自身内容足够即完成，不等下游；[NOT_DEV_REQ] 标记也视为完成
            const dr = state['decomposition_result'];
            if (dr && typeof dr === 'string' && dr.startsWith('[NOT_DEV_REQ]')) {
                return true;
            }
            return dr && dr.length > 200;
        }
        if (step.key === '_reasoning') {
            return !!state['parallel_reasoning_result'];
        }
        if (step.key === 'parallel_reasoning_result') {
            return state['workflow_status'] === 'WAITING_REVIEW' || !!state['review_content'];
        }
        if (step.key === 'generated_code') {
            return state['code_project_root'] != null;
        }
        return state[step.key] != null;
    }

    function hasReasoningOutput(state) {
        for (const k of Object.keys(state)) {
            if (/^reasoning_.+_result$/.test(k) && state[k]) return true;
        }
        return false;
    }

    /** SSE 事件键是否匹配进度步骤键 */
    function stepKeyMatches(stepKey, sseKey) {
        if (stepKey === sseKey) return true;
        if (stepKey === '_reasoning' && /^reasoning_.+_result$/.test(sseKey)) return true;
        if (stepKey === '_review' && (sseKey === 'review_decision' || sseKey === 'review_content' || sseKey === 'workflow_status')) return true;
        return false;
    }

    function getStepContent(state, step) {
        // 根据步骤 key 映射到 State 中的具体字段
        const key = step.key;
        if (key === 'requirement') {
            // 工作流初始化：展示研发需求 + 审核备注（如果有）
            const req = state['requirement'];
            if (!req || !req.trim()) return ''; // 无实际数据时显示"思考中..."
            let content = '【研发需求】\n' + req;
            const feedback = state['review_feedback'];
            if (feedback && feedback.trim() && !req.includes(feedback.trim())) {
                content += '\n\n【审核备注】\n' + feedback;
            }
            return content;
        }
        if (key === 'decomposition_result') return state['decomposition_result'] || '';
        if (key === '_reasoning') {
            const parts = [];
            for (const k of Object.keys(state).sort()) {
                if (/^reasoning_.+_result$/.test(k) && state[k]) {
                    const label = fieldLabel(k) || k;
                    parts.push('===== ' + label + ' =====\n' + state[k]);
                }
            }
            return parts.join('\n\n');
        }
        if (key === 'parallel_reasoning_result') return state['parallel_reasoning_result'] || '';
        if (key === '_review') return state['review_content'] || '';
        if (key === 'generated_code') return state['generated_code'] || '';
        return '';
    }

    /**
     * 从沙箱验证结果中提取关键行，忽略 Spring Boot 日志等噪音。
     * 展示：成功/失败标记、编译错误、构建结果、异常堆栈。
     * 无关键行时回退原文（防止全丢失）。
     */
    function extractHarnessKeyLines(hr) {
        if (!hr) return '';
        const keyLines = [];
        for (const l of hr.split('\n')) {
            const t = l.trim();
            if (/^(COMPILE|TEST|RUNTIME)_(SUCCESS|FAILED|ERROR)/.test(t)          // COMPILE_SUCCESS: true 等
                || t.indexOf('[ERROR]') > -1                                       // 编译错误
                || t.indexOf('BUILD FAILURE') > -1 || t.indexOf('BUILD SUCCESS') > -1
                || t.indexOf('cannot find symbol') > -1 || t.indexOf('Caused by:') > -1
                || t.indexOf('APPLICATION FAILED') > -1) {                          // 启动失败
                keyLines.push(l);
            }
        }
        return keyLines.length > 0 ? keyLines.join('\n') : truncateHarnessFallback(hr);
    }

    /** 兜底：无关键行时截断显示原文，避免超长日志刷屏 */
    function truncateHarnessFallback(hr) {
        const MAX = 800;
        if (hr.length <= MAX) return hr;
        return hr.substring(0, MAX) + '\n... (内容过长，已截断)';
    }

    function resolveActiveStepKey(state, sseActiveKey) {
        // 终态/暂停态：没有活跃步骤，全部标记 done
        const ws = state['workflow_status'] || '';
        if (ws === 'WAITING_REVIEW' || ws === 'COMPLETED' || ws === 'TERMINATED' || ws === 'FAILED') return null;

        const sseMap = window._sseLastUpdate || {};
        const now = Date.now();

        // 并行推理流式输出中
        for (const k of Object.keys(sseMap)) {
            if (/^reasoning_.+_result$/.test(k) && now - (sseMap[k] || 0) < 15000) {
                return '_reasoning';
            }
        }
        // 需求拆解流式输出中
        if (sseActiveKey === 'decomposition_result' && now - (sseMap['decomposition_result'] || 0) < 15000) {
            return 'decomposition_result';
        }
        // 拆解刚结束、推理尚未有输出：提前激活并行推理步骤（显示"思考中..."）
        if (state['decomposition_result'] && !hasReasoningOutput(state) && !state['parallel_reasoning_result']) {
            const decompAge = now - (sseMap['decomposition_result'] || 0);
            if (decompAge > 5000) return '_reasoning';
        }
        // 合并/审核等步骤
        if (sseActiveKey && now - (sseMap[sseActiveKey] || 0) < 15000) {
            if (sseActiveKey === 'parallel_reasoning_result') return 'parallel_reasoning_result';
            if (sseActiveKey === 'review_content') return '_review';
            if (sseActiveKey === 'generated_code') return sseActiveKey;
        }

        // 默认：优先取最近有 SSE 更新的未完成步骤（修复循环/编译中精准定位活跃步骤）；
        // 都没有更新时才取第一个未完成步骤
        let firstIncomplete = null;
        let best = null, bestAge = Infinity;
        for (const step of WORKFLOW_STEPS) {
            if (checkStepDone(state, step)) continue;
            if (!firstIncomplete) firstIncomplete = step.key;
            const lu = sseMap[step.key];
            if (lu) {
                const age = now - lu;
                if (age < bestAge) { bestAge = age; best = step.key; }
            }
        }
        return best || firstIncomplete;
    }

    function getStallHint(stepKey) {
        const luMap = window._sseLastUpdate || {};
        let lu = luMap[stepKey] || 0;
        if (stepKey === '_reasoning') {
            for (const k of Object.keys(luMap)) {
                if (/^reasoning_.+_result$/.test(k)) {
                    lu = Math.max(lu, luMap[k] || 0);
                }
            }
        }
        const age = Date.now() - lu;
        if (lu && age > 4000) {
            return true;
        }
        return false;
    }

    /**
     * 增量渲染进度面板。
     * - 首次调用：完整构建 DOM。
     * - 后续调用：复用已有 DOM 节点，只更新状态 class 和活跃步骤的 textContent，
     *   避免重建 DOM 导致已完成步骤的滚动位置丢失。
     */
    function renderProgress(state, sseActiveKey) {
        const stepsDiv = $('steps');
        const isFirstRender = !stepsDiv.querySelector('.progress-step');

        if (isFirstRender) {
            // 首次：完整构建骨架
            let html = '';
            for (const step of WORKFLOW_STEPS) {
                html += `<div class="progress-step" data-step-key="${step.key}">
                    <span class="step-icon"></span>
                    <span class="step-name">${step.name}</span>
                    <div class="step-body" data-step="${step.key}"></div>
                </div>`;
            }
            stepsDiv.innerHTML = html;
            // 为所有 step-body 绑定滚动监听（一次性）
            stepsDiv.querySelectorAll('.step-body').forEach(function(el) {
                el.addEventListener('scroll', function() {
                    el._userScrolled = (el.scrollHeight - el.scrollTop - el.clientHeight) > 30;
                });
            });
        }

        // 判断是否处于"等待人工审核"暂停态——此时不应有 active 步骤
        const isWaitingReview = state['workflow_status'] === 'WAITING_REVIEW';
        const activeStepKey = resolveActiveStepKey(state, sseActiveKey);

        // 增量更新每个步骤
        stepsDiv.querySelectorAll('.progress-step').forEach(function(stepEl) {
            const stepKey = stepEl.getAttribute('data-step-key');
            const step = WORKFLOW_STEPS.find(s => s.key === stepKey);
            if (!step) return;

            let done = checkStepDone(state, step);
            // 当前活跃步骤不能标记为 done
            if (step.key === activeStepKey) {
                done = false;
            }

            // 确定 class
            let cls;
            if (done) {
                cls = 'done';
            } else if (isWaitingReview) {
                cls = '';
            } else if (step.key === activeStepKey) {
                cls = 'active';
            } else {
                cls = '';
            }

            // 只在 class 变化时更新（避免不必要的 DOM 操作）
            if (stepEl.getAttribute('data-last-cls') !== cls) {
                stepEl.className = 'progress-step' + (cls ? ' ' + cls : '');
                stepEl.querySelector('.step-icon').textContent = done ? '✓' : (cls === 'active' ? '⋯' : '');
                stepEl.setAttribute('data-last-cls', cls);
            }

            // 更新内容：只有 done 或 active 步骤显示内容
            const bodyEl = stepEl.querySelector('.step-body');
            const hasContent = (step.key === 'validation_passed' || step.key === 'harness_result') 
                && state[step.key] != null;
            const showContent = done || cls === 'active' || hasContent;
            const content = showContent ? getStepContent(state, step) : '';

            if (content) {
                // 使用独立文本 span，避免 textContent 清除 stall-indicator 子元素
                var textEl = bodyEl.querySelector('.step-text');
                if (!textEl) {
                    // 清除旧 innerHTML 残留的"思考中..."（从无内容→有内容过渡时遗留）
                    if (bodyEl.getAttribute('data-thinking')) {
                        bodyEl.innerHTML = '';
                    }
                    textEl = document.createElement('span');
                    textEl.className = 'step-text';
                    bodyEl.appendChild(textEl);
                }
                if (textEl.textContent !== content) {
                    const wasAtBottom = cls === 'active' && !bodyEl._userScrolled;
                    textEl.textContent = content;
                    bodyEl.style.display = '';
                    bodyEl.removeAttribute('data-thinking');
                    if (wasAtBottom) {
                        bodyEl.scrollTop = bodyEl.scrollHeight;
                    }
                    bodyEl._userScrolled = false;
                }
                // stall hint：步骤 active 时检测停顿，显示在内容下方
                const stallText = cls === 'active' ? getStallHint(step.key) : '';
                let stallEl = stepEl.querySelector('.stall-indicator');
                const hadStall = stallEl && stallEl.style.display !== 'none';
                if (stallText) {
                    if (!stallEl) {
                        stallEl = document.createElement('div');
                        stallEl.className = 'stall-indicator';
                        bodyEl.appendChild(stallEl);
                    }
                    stallEl.innerHTML = '<span style="color:#ff9800;">⏳ 思考中<span class="thinking-dot">.</span><span class="thinking-dot">.</span><span class="thinking-dot">.</span></span>';
                    stallEl.style.display = '';
                    // stall hint 活跃期间，每次渲染都保持滚动到底部（除非用户手动上滚）
                    if (!bodyEl._userScrolled) {
                        bodyEl.scrollTop = bodyEl.scrollHeight;
                    }
                } else {
                    if (stallEl) stallEl.style.display = 'none';
                }
            } else if (cls === 'active') {
                // active 步骤尚无内容：显示"思考中..."过渡提示
                if (!bodyEl.getAttribute('data-thinking')) {
                    bodyEl.innerHTML = '<span style="color:#888;">思考中<span class="thinking-dot">.</span><span class="thinking-dot">.</span><span class="thinking-dot">.</span></span>';
                    bodyEl.setAttribute('data-thinking', '1');
                    bodyEl.style.display = '';
                }
            } else {
                // 无内容且非 active：隐藏
                if (bodyEl.style.display !== 'none') {
                    bodyEl.style.display = 'none';
                    bodyEl.textContent = '';
                    bodyEl.removeAttribute('data-thinking');
                }
            }
        });

    }

    /**
     * 启动 SSE 监听。
     * @param threadId 工作流线程 ID
     * @param preserveContent 是否保留已有步骤内容（APPROVED 时 true，首次/SENT_BACK 时 false）
     */
    function listenEvents(threadId, preserveContent) {
        closeEvents();
        $('progress').classList.add('show');
        $('progressThreadId').textContent = 'Thread: ' + threadId;
        $('resumeThreadId').value = threadId;
        $('finalStatus').style.display = 'none';   // 隐藏终态区域

        const state = {};
        window._workflowState = state;
        let lastSseKey = null;
        let sseErrorCount = 0;
        // 修复循环轮次追踪：检测 repair_count 递增 / repair_feedback 变化 来识别新轮次
        let lastRepairCount = 0;
        let lastRepairFeedback = '';
        // 记录每个 SSE key 最后一次事件到达的时间戳（全局可访问，供 getStallHint 使用）
        window._sseLastUpdate = {};

        // 检测"新一轮修复开始了"（两种信号任一触发即判定新轮次）
        function isNewRepairRound(key, value) {
            if (key === 'repair_count') {
                const c = parseInt(value) || 0;
                if (c !== lastRepairCount) { lastRepairCount = c; return true; }
            }
            if (key === 'repair_feedback') {
                const f = String(value || '');
                if (f !== lastRepairFeedback) { lastRepairFeedback = f; return true; }
            }
            return false;
        }

        const sseLastUpdate = window._sseLastUpdate;

        if (preserveContent) {
            // APPROVED：保留已有步骤内容，立即查询完整 state 并渲染
            // renderProgress 中 active 步骤无内容时会自动显示"思考中..."
            fetch(API_BASE + '/state/' + encodeURIComponent(threadId))
                .then(r => r.json())
                .then(json => {
                    if (json.code === 0 && json.data && json.data.state) {
                        for (const [k, v] of Object.entries(json.data.state)) {
                            state[k] = v;
                        }
                        // 渲染：已有步骤标记 done，代码生成标记 active（自动显示"思考中..."）
                        renderProgress(state, null);
                    }
                }).catch(function(){});
        } else {
            // 首次执行 / SENT_BACK：清空所有步骤，从头渲染
            $('steps').innerHTML = '';
            WORKFLOW_STEPS.forEach(s => s.done = false);
            renderProgress({}, null);
        }

        // 创建 SSE 连接的函数（支持重连）
        function connectSSE() {
            es = new EventSource(API_BASE + '/events/' + encodeURIComponent(threadId));

            // SSE 实时事件
            es.onmessage = function(e) {
                // SSE 事件到达说明工作流正在执行中，隐藏恢复执行横幅
                setRecoverVisible(false);
                try {
                    const d = JSON.parse(e.data);
                    if (d.key && d.value != null) {
                        // 修复循环新轮次检测：reset CODE_REPAIR_ANALYSIS
                        if (isNewRepairRound(d.key, d.value)) {
                            state['code_repair_analysis'] = '';
                        }

                        // 增量事件：追加拼接；全量事件：直接覆盖
                        const isDelta = !!d._delta;
                        // 修复循环进行中：CODE_REPAIR_ANALYSIS 拒绝非增量覆盖（防止 checkpoint 轮询清空）
                        const repairOngoing = (parseInt(state['repair_count']) || 0) > 0
                            && state['validation_passed'] !== 'true' && state['validation_passed'] !== true;
                        if (isDelta) {
                            state[d.key] = (state[d.key] || '') + d.value;
                        } else if (d.key === 'code_repair_analysis' && repairOngoing && state[d.key] && state[d.key].length > 0) {
                            // 修复循环中已有累积内容，拒绝非增量覆盖以保证新轮次内容不被 checkpoint 清空
                        } else {
                            // 推理启动空信号：保留已有增量，不覆盖
                            if (/^reasoning_.+_result$/.test(d.key) && d.value === '' && state[d.key]) {
                                // skip overwrite
                            } else {
                                state[d.key] = d.value;
                            }
                        }
                        if (d.value.length > 0) {
                            lastSseKey = d.key;
                            sseLastUpdate[d.key] = Date.now();
                        }
                        // 并行推理：任意事件（含启动信号）均切换活跃步骤
                        if (/^reasoning_.+_result$/.test(d.key)) {
                            lastSseKey = d.key;
                            sseLastUpdate[d.key] = Date.now();
                            sseLastUpdate['_reasoning'] = Date.now();
                        }
                        renderProgress(state, lastSseKey);

                        // 检测终态：仅 workflow_status 携带终态信号
                        if (d.key === 'workflow_status' && d.status && d.status !== 'RUNNING') {
                            handleWorkflowFinished(threadId, d.status);
                        }
                    }
                } catch(ignore) {}
            };

            // SSE 连接异常断开时，先查询状态再决定处理方式
            es.onerror = function() {
                console.log('[SSE onerror] 触发, sseErrorCount=' + sseErrorCount + ', threadId=' + threadId + ', pollFallback=' + !!pollFallback + ', pollDelayTimer=' + !!pollDelayTimer);
                if (es) { es.close(); es = null; }
                // 如果 closeEvents 已被调用（终态处理中），不再重连
                if (pollFallback === null && pollDelayTimer === null) {
                    console.log('[SSE onerror] 轮询已关闭，忽略');
                    return;
                }

                fetch(API_BASE + '/state/' + encodeURIComponent(threadId))
                    .then(r => r.json())
                    .then(json => {
                        if (json.code === 0) {
                            const s = json.data && json.data.status;
                            console.log('[SSE onerror] 查询状态=' + s + ', sseErrorCount=' + sseErrorCount);
                            if (s === 'RUNNING' && sseErrorCount < 5) {
                                sseErrorCount++;
                                setTimeout(connectSSE, 1000);
                            } else {
                                handleWorkflowFinished(threadId, s);
                            }
                        } else {
                            handleWorkflowFinished(threadId, null);
                        }
                    }).catch(function() {
                        console.log('[SSE onerror] 查询状态失败');
                        handleWorkflowFinished(threadId, null);
                    });
            };
        }

        connectSSE();

        // 后台轮询补漏（延迟 3 秒启动，每 2 秒轮询）
        pollDelayTimer = setTimeout(function() {
            pollFallback = setInterval(function() {
                fetch(API_BASE + '/state/' + encodeURIComponent(threadId))
                    .then(r => r.json())
                    .then(json => {
                        if (json.code === 0 && json.data && json.data.state) {
                            // 检测终态：SSE 事件可能被错过，轮询兜底触发终态处理
                            const newStatus = json.data.status;
                            if (newStatus && newStatus !== 'RUNNING') {
                                handleWorkflowFinished(threadId, newStatus);
                                return;
                            }
                            let updated = false;
                            // 跳过"最近 15 秒内活跃的流式 key"：这些 key 正由 SSE 增量追加接管，
                            // 轮询的全量覆盖会用 checkpoint 旧值覆盖已累积内容导致"清空重来"。
                            const nowTs = Date.now();
                            const activeKeys = new Set();
                            for (const k of Object.keys(sseLastUpdate)) {
                                if (nowTs - sseLastUpdate[k] < 15000) activeKeys.add(k);
                            }
                            for (const [k, v] of Object.entries(json.data.state)) {
                                if (activeKeys.has(k)) continue;
                                // 修复循环中：CODE_REPAIR_ANALYSIS 拒绝轮询覆盖（防止 checkpoint 清空流式累积内容）
                                const repairActive = (parseInt(state['repair_count']) || 0) > 0
                                    && state['validation_passed'] !== 'true' && state['validation_passed'] !== true;
                                if (k === 'code_repair_analysis' && repairActive && state[k] && state[k].length > 0) continue;
                                if (state[k] !== v) {
                                    state[k] = v;
                                    updated = true;
                                }
                            }
                            // 始终调用 renderProgress（即使 state 未变），确保 stall hint 等时效性 UI 能更新
                            renderProgress(state, lastSseKey);
                        }
                    }).catch(function(){});
            }, 2000);
        }, 3000);
    }

    /**
     * 工作流执行结束处理：关闭 SSE/轮询，查询最终状态，更新 UI。
     * 可由 SSE onmessage 检测到终态 status 触发，也可由 onerror 兜底触发。
     * 不再跳转结果面板，所有信息都在进度面板内展示。
     * @param threadId 工作流线程 ID
     * @param knownStatus 已知的状态（来自 SSE 事件），null 表示未知需查询
     */
    function handleWorkflowFinished(threadId, knownStatus) {
        console.log('[handleWorkflowFinished] 调用, knownStatus=' + knownStatus + ', threadId=' + threadId);
        // 防止重复处理
        if (es === null && pollFallback === null && pollDelayTimer === null) {
            console.log('[handleWorkflowFinished] 已关闭，跳过');
            return;
        }
        closeEvents();

        fetch(API_BASE + '/state/' + encodeURIComponent(threadId))
            .then(r => r.json())
            .then(json => {
                if (json.code === 0) {
                    const data = json.data;
                    // 修复竞态：SSE 先收到 WAITING_REVIEW，但 /state 可能尚未更新（checkpoint 写入延迟）
                    const effectiveStatus = (knownStatus === 'WAITING_REVIEW' && data.status === 'RUNNING')
                        ? 'WAITING_REVIEW' : data.status;
                    // 用完整 State 渲染进度条（补上非 MultiRoundAgentNode 节点的输出）
                    // 注入终态 workflow_status：checkpoint 保存于终态前节点，不含终态标记
                    if (data.state) {
                        // 合并 SSE 已累积的字段：/state 的 checkpoint 可能因写入时序缺失
                        // review_content 等字段（尤其 WAITING_REVIEW 暂停时），保留前端已有值
                        if (window._workflowState) {
                            for (const k of Object.keys(window._workflowState)) {
                                if (window._workflowState[k] != null && data.state[k] == null) {
                                    data.state[k] = window._workflowState[k];
                                }
                            }
                        }
                        data.state['workflow_status'] = effectiveStatus;
                        renderProgress(data.state, null);
                    }

        if (effectiveStatus === 'WAITING_REVIEW') {
            console.log('[handleWorkflowFinished] → WAITING_REVIEW，启用审核按钮');
            // 等待人工审核：启用审核操作按钮
                        $('resumeThreadId').value = threadId;
                        setResumeButtonsEnabled(true);
                        $('finalStatus').style.display = 'none';
                        setRecoverVisible(false);
                    } else if (effectiveStatus === 'RUNNING' || effectiveStatus === 'FAILED') {
                        console.log('[handleWorkflowFinished] → ' + effectiveStatus + '，重新监听/恢复');
                        setResumeButtonsEnabled(false);
                        // FAILED：流已死，不启动 SSE，只显示恢复 + 错误
                        if (effectiveStatus === 'FAILED') {
                            setRecoverVisible(true, effectiveStatus);
                            showFinalStatus(data);
                        } else {
                            listenEvents(threadId, true);
                            setRecoverVisible(true, effectiveStatus);
                            $('finalStatus').style.display = 'none';
                        }
                    } else {
                        console.log('[handleWorkflowFinished] → ' + effectiveStatus + '，显示终态');
                        console.log('[handleWorkflowFinished] window._workflowState keys:', window._workflowState ? Object.keys(window._workflowState).join(',') : 'null');
                        console.log('[handleWorkflowFinished] code_project_root=', window._workflowState ? window._workflowState['code_project_root'] : 'null');
                        console.log('[handleWorkflowFinished] generated_code length=', window._workflowState ? (window._workflowState['generated_code'] || '').length : 0);
                        // COMPLETED / TERMINATED：直接用 SSE 累积状态渲染，不依赖 checkpoint
                        setResumeButtonsEnabled(false);
                        if (window._workflowState) {
                            window._workflowState['workflow_status'] = effectiveStatus;
                            renderProgress(window._workflowState, null);
                        }
                        showFinalStatus(data);
                    }
                } else {
                    showResult('<p style="color:red;">错误：' + escapeHtml(json.message || '未知错误') + '</p>', true);
                }
            }).catch(function() {
                // 网络异常等，忽略
            });
    }

    /** 在进度面板底部展示终态信息 */
    function showFinalStatus(data) {
        const el = $('finalStatus');
        const status = data.status || 'UNKNOWN';
        const colors = {
            'COMPLETED':  { bg: '#d4edda', border: '#28a745', text: '#155724', icon: '✅' },
            'TERMINATED': { bg: '#f8d7da', border: '#dc3545', text: '#721c24', icon: '🛑' },
            'FAILED':     { bg: '#e2e3e5', border: '#6c757d', text: '#383d41', icon: '❌' },
        };
        const c = colors[status] || colors['FAILED'];
        let html = '<div style="background:' + c.bg + ';color:' + c.text + ';padding:12px;border-radius:6px;border:1px solid ' + c.border + ';">';
        html += '<strong style="font-size:14px;">' + c.icon + ' 工作流' + status + '</strong>';
        const sseMsg = window._workflowState && window._workflowState['workflow_message'];
        const message = (sseMsg && sseMsg !== '工作流已启动') ? sseMsg : (data.message || '');
        console.log('[showFinalStatus] status=' + status + ', sseMsg=' + JSON.stringify(sseMsg) + ', data.message=' + JSON.stringify(data.message));
        if (message && message !== '工作流已启动') {
            html += '<div style="margin-top:4px;font-size:13px;">' + escapeHtml(message) + '</div>';
        }
        if (status === 'COMPLETED') {
            html += '<div style="margin-top:8px;padding:10px;background:#e3f2fd;border-radius:4px;font-size:14px;font-weight:bold;text-align:center;">🚀 进入沙箱验证</div>';
        }
        html += '</div>';
        el.innerHTML = html;
        el.style.display = 'block';
        if (status !== 'FAILED') setRecoverVisible(false);
    }

    function closeEvents() {
        if (es) { es.close(); es = null; }
        if (pollFallback) { clearInterval(pollFallback); pollFallback = null; }
        if (pollDelayTimer) { clearTimeout(pollDelayTimer); pollDelayTimer = null; }
    }

    function setResumeButtonsEnabled(enabled) {
        ['btnApprove', 'btnSentBack', 'btnTerminate'].forEach(function(id) {
            $(id).disabled = !enabled;
        });
        if (enabled) setRecoverVisible(false);
    }

    function setRecoverVisible(visible, status) {
        $('recoverSection').style.display = visible ? 'block' : 'none';
        if (visible && status) {
            const title = status === 'FAILED' ? '⚠️ 工作流执行失败' : '🔁 工作流处于执行中状态';
            $('recoverTitle').textContent = title;
        }
    }

    function renderResult(data) {
        let html = '';
        html += '<p><strong>Thread ID：</strong>' + escapeHtml(data.threadId || '-') + '</p>';
        html += '<p><strong>状态：</strong>' + statusTag(data.status || '-') + '</p>';
        html += '<p><strong>消息：</strong>' + escapeHtml(data.message || '-') + '</p>';
        html += '<p><strong>是否暂停：</strong>' + (data.interrupted ? '是 (等待人工审核)' : '否') + '</p>';
        if (data.interruptedNode) {
            html += '<p><strong>暂停节点：</strong>' + escapeHtml(data.interruptedNode) + '</p>';
        }
        if (data.state) {
            html += '<p style="margin-top:10px;"><strong>State 数据：</strong></p>';
            html += renderStateTable(data.state);
        }
        return html;
    }

    // ---------- 1. 启动工作流 ----------
    async function startWorkflow() {
        const requirement = $('requirement').value.trim();
        if (!requirement) { alert('请输入研发需求'); return; }

        hideLoading();
        $('result').classList.remove('show', 'error');
        $('comment').value = ''; // 清空审核备注输入框
        try {
            const res = await fetch(API_BASE + '/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ requirement: requirement })
            });
            const json = await res.json();
            if (json.code === 0 && json.data && json.data.threadId) {
                listenEvents(json.data.threadId);
            } else {
                showResult('<p style="color:red;">错误：' + escapeHtml(json.message || '未知错误') + '</p>', true);
            }
        } catch (err) {
            showResult('<p style="color:red;">请求失败：' + escapeHtml(err.message) + '</p>', true);
        }
    }

    // ---------- 2. 查询状态 ----------
    async function queryState() {
        const threadId = $('queryThreadId').value.trim();
        if (!threadId) { alert('请输入 threadId'); return; }

        showLoading();
        try {
            const res = await fetch(API_BASE + '/state/' + encodeURIComponent(threadId));
            const json = await res.json();
            if (json.code === 0) {
                hideLoading();
                const d = json.data;
                // 在进度面板中展示查询结果
                $('progress').classList.add('show');
                $('progressThreadId').textContent = 'Thread: ' + threadId;
                $('steps').innerHTML = '';
                $('finalStatus').style.display = 'none';
                if (d.state) {
                    d.state['workflow_status'] = d.status;
                    // 兜底：checkpoint 可能缺 code_project_root，有生成代码就视为已写出
                    if (d.status === 'COMPLETED' && d.state['generated_code'] && !d.state['code_project_root']) {
                        d.state['code_project_root'] = d.state['generated_code'];
                    }
                    renderProgress(d.state, null);
                    // 回填研发需求到输入框
                    const req = d.state['requirement'];
                    if (req) {
                        $('requirement').value = req;
                        $('requirement').disabled = true;
                        $('btnStart').disabled = true;
                    }
                }

                if (d && d.status === 'WAITING_REVIEW') {
                    $('resumeThreadId').value = threadId;
                    setResumeButtonsEnabled(true);
                    setRecoverVisible(false);
                } else if (d && (d.status === 'RUNNING' || d.status === 'FAILED')) {
                    // RUNNING：可能中断，启动 SSE 监听；FAILED：流已死，只显示恢复
                    setResumeButtonsEnabled(false);
                    if (d.status === 'RUNNING') {
                        listenEvents(threadId, true);
                        $('finalStatus').style.display = 'none';
                    } else {
                        showFinalStatus(d);
                    }
                    setRecoverVisible(true, d.status);
                } else if (d) {
                    setResumeButtonsEnabled(false);
                    setRecoverVisible(false);
                    showFinalStatus(d);
                }
            } else {
                showResult('<p style="color:red;">错误：' + escapeHtml(json.message || '未知错误') + '</p>', true);
            }
        } catch (err) {
            showResult('<p style="color:red;">请求失败：' + escapeHtml(err.message) + '</p>', true);
        }
    }

    // ---------- 3. 恢复工作流 ----------
    async function resumeWorkflow(decision) {
        const threadId = $('resumeThreadId').value.trim();
        const comment = $('comment').value.trim();
        if (!threadId) { alert('请输入 threadId'); return; }

        const prompts = {
            'APPROVED': '确认通过审核吗？通过后将进入代码生成阶段。',
            'SENT_BACK': '确认驳回吗？驳回后将重新回到需求拆解阶段。',
            'TERMINATED': '确认拒绝吗？拒绝后该流程将被终止且不可恢复。'
        };
        if (!confirm(prompts[decision])) return;

        hideLoading();
        $('result').classList.remove('show', 'error');
        try {
            const body = {
                threadId: threadId,
                reviewDecision: decision
            };
            if (comment) body.comment = comment;

            const res = await fetch(API_BASE + '/resume', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const json = await res.json();
            if (json.code === 0) {
                if (json.data && json.data.status === 'RUNNING') {
                    // RUNNING → SSE 监听
                    // APPROVED：保留已有步骤内容（需求拆解、推理结果等），只监听后续步骤
                    // SENT_BACK：清空所有内容从头开始（驳回重跑）
                    const preserve = (decision === 'APPROVED');
                    listenEvents(json.data.threadId, preserve);
                } else {
                    // TERMINATED 同步返回：在进度面板展示终态信息
                    setResumeButtonsEnabled(false);
                    showFinalStatus(json.data);
                }
            } else {
                showResult('<p style="color:red;">错误：' + escapeHtml(json.message || '未知错误') + '</p>', true);
            }
        } catch (err) {
            showResult('<p style="color:red;">请求失败：' + escapeHtml(err.message) + '</p>', true);
        }
    }

    // 回车快捷查询
    $('queryThreadId').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') queryState();
    });

    // 初始状态：审核按钮默认禁用
    setResumeButtonsEnabled(false);

    function setRecoverVisible(visible, status) {
        $('recoverSection').style.display = visible ? 'block' : 'none';
        if (visible && status) {
            const title = status === 'FAILED' ? '⚠️ 工作流执行失败' : '🔁 工作流处于执行中状态';
            $('recoverTitle').textContent = title;
        }
    }

    // 从 checkpoint 恢复执行（服务重启后）
    async function recoverWorkflow() {
        const threadId = $('queryThreadId').value.trim() || $('resumeThreadId').value.trim();
        if (!threadId) { alert('请输入 threadId'); return; }
        if (!confirm('确定要从 checkpoint 恢复执行吗？')) return;

        try {
            const res = await fetch(API_BASE + '/recover/' + encodeURIComponent(threadId), { method: 'POST' });
            const json = await res.json();
            if (json.code === 0) {
                // 开始 SSE 监听
                listenEvents(threadId, true);
                setRecoverVisible(false);
            } else {
                alert('恢复失败：' + (json.message || '未知错误'));
            }
        } catch (err) {
            alert('恢复失败：' + err.message);
        }
    }

    // URL 参数自动查询：从 workflow-history.html 跳转过来
    (function() {
        const params = new URLSearchParams(window.location.search);
        const tid = params.get('threadId');
        if (tid) {
            $('queryThreadId').value = tid;
            queryState();
        }
    })();
</script>
</body>
</html>
