spring:
  mvc:
    async:
      request-timeout: 3600000  # 60 分钟，覆盖 SSE 长连接场景（沙箱编译+修复循环可能耗时较长）
  ai:
    openai:
      api-key: ${ZPAPIKEY}
      base-url: https://open.bigmodel.cn/api/paas
    dashscope:
      api-key: ${LIAPIKEY}
    ollama:
      base-url: http://localhost:11434
      timeout: 60s
    models:
      - name: glm-4.7-flash:q4_K_M
        type: ollama
        model: glm-4.7-flash:q4_K_M
        temperature: 0.7
        max-tokens: 4096
      - name: gemma4:26b-a4b-it-q4_K_M
        type: ollama
        model: gemma4:26b-a4b-it-q4_K_M
        temperature: 0.7
        max-tokens: 4096
      - name: qwen3:8b-q4_K_M
        type: ollama
        model: qwen3:8b-q4_K_M
        temperature: 0.5
        max-tokens: 3072
        num-ctx: 3072
        num-gpu: 22
        num-batch: 256
      - name: qwen3:4b
        type: ollama
        model: qwen3:4b
        temperature: 0.5
        max-tokens: 4096
        num-ctx: 3072
        num-gpu: 22
        num-batch: 256
      - name: ornith-1.5:9b
        type: ollama
        model: ornith-1.5:9b
        temperature: 0.5
        max-tokens: 4096
        num-ctx: 3072
        num-gpu: 22
        num-batch: 256
      - name: glm-5.2
        type: dashscope
        model: glm-5.2
        temperature: 0.7
        max-tokens: 8192
      - name: deepseek-v4-pro
        type: openai
        model: deepseek-v4-pro
        temperature: 0.5
        max-tokens: 8192
        base-url: https://api.deepseek.com
        api-key: ${DEEPSEEKAPIKEY}
      - name: glm-4.7-flash
        type: openai
        model: glm-4.7-flash
        temperature: 0.5
        max-tokens: 8192
        completions-path: /v4/chat/completions
    primary: ornith-1.5:9b

  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeChatAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAgentAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeImageAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeVideoAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioSpeechAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioTranscriptionAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeRerankAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeEmbeddingAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeMultimodalEmbeddingAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAsyncToolCallingManagerAutoConfiguration

  datasource:
    username: root
    url: jdbc:mysql://192.168.46.147:3306/ai_server?serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8
    password: 123456
#    password: root@123456
#    url: jdbc:mysql://111.10.175.134:3307/ai_server?serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      keep-alive: true
      validation-query: SELECT 1
      min-idle: 1
      test-while-idle: true
      test-on-borrow: true
      min-evictable-idle-time-millis: 120000
      time-between-eviction-runs-millis: 30000
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  data:
    redis:
      host: 192.168.46.147
#      host: 192.168.1.118
      port: 6380
      password: redis123456
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1
          max-wait: 2000ms

logging:
  level:
    root: INFO

# DinD 沙箱：连接 Docker
agenthub:
  workflow:
    sandbox:
#      docker-host: "tcp://111.10.175.134:2375"
      docker-host: "tcp://192.168.46.147:2375"
      dind-enabled: true
  # llm-wiki 知识库服务（知识库 B，Python FastAPI 服务）
  llm-wiki:
    base-url: http://localhost:8000/api/v1
    connect-timeout-ms: 3000
    read-timeout-ms: 60000
    upload-timeout-ms: 300000     # 上传专用超时（文档 embedding 较慢）

