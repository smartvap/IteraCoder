spring:
  ai:
    dashscope:
      api-key: ${QWENAPIKEY}
    ollama:
      base-url: http://localhost:11434
      timeout: 30s
    models:
      - name: gemma2
        type: ollama
        model: gemma2:2b
        temperature: 0.7
        max-tokens: 512
      - name: qwen3
        type: ollama
        model: qwen3:4b
        temperature: 0.5
        max-tokens: 1024
      - name: deepseek-v4-pro
        type: dashscope
        model: deepseek-v4-pro
        temperature: 0.7
        max-tokens: 4096
      - name: qwen-max
        type: dashscope
        model: qwen-max
        temperature: 0.5
        max-tokens: 4096
    primary: qwen3

  datasource:
    username: root
    password: 123456
    url: jdbc:mysql://192.168.46.128:3306/ai_server?serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  data:
    redis:
      host: 192.168.46.128
      port: 6379
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1
          max-wait: 2000ms

logging:
  level:
    root: INFO
